name: Public evaluation framework
on:
  push:
    paths: ['public_eval/**', 'data/**', '.github/workflows/public-eval.yml']
  pull_request:
    paths: ['public_eval/**', 'data/**', '.github/workflows/public-eval.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install ./public_eval
      - run: python -m unittest discover -s public_eval/tests -q
      - name: Validate bundled release formats
        run: |
          hclbench validate --dataset data/release-20261029/HealthCLBench.csv
          hclbench validate --dataset data/release-20261029/HealthCLBench.jsonl
      - run: python public_eval/examples/demo.py --output "${{ runner.temp }}/hclbench-demo"
      - run: hclbench --help && hclbench-run --help && hclbench-report --help
